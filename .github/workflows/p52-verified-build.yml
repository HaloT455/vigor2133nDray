name: P52 synthetic CI build (NOT FLASHABLE)
on:
  push:
    branches:
      - work/v2133n-fixes
    paths:
      - 'p52/**'
      - 'tests/test_p52_guard.py'
      - '.github/workflows/p52-verified-build.yml'
  workflow_dispatch:
jobs:
  p52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependency
        run: python -m pip install -r requirements.txt
      - name: P52 safety unit tests
        run: python -m unittest tests.test_p52_guard -v
      - name: Browser-side script syntax
        run: node --check p52/diagnostic.js
      - name: Build 1312-resource SYNTHETIC lab ROM with checksum and PFS roundtrip
        run: python -m p52.ci_fixture /tmp/p52-SYNTHETIC-DO-NOT-FLASH.all
      - uses: actions/upload-artifact@v4
        with:
          name: P52-SYNTHETIC-NOT-FLASHABLE
          path: |
            /tmp/p52-SYNTHETIC-DO-NOT-FLASH.all
            /tmp/p52-SYNTHETIC-CI-REPORT.json
          retention-days: 7

name: Source checks (NO FLASH)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python LZ4 dependency
        run: python -m pip install -r requirements.txt
      - name: Unit tests (synthetic fixture only)
        run: python -m unittest discover -s tests -v
